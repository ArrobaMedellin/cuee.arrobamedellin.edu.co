# Despliegue automático al hacer push a main.
#
# Cloud Build entra a la VM por el túnel IAP y ejecuta el script de despliegue
# que vive allí (/opt/deploy/deploy.sh). La lógica está en la VM, no aquí, para
# que todos los repos compartan el mismo procedimiento: build, reinicio, health
# check y rollback automático si la versión nueva no responde.
#
# Requiere en el proyecto de GCP:
#   - cuenta de Cloud Build con compute.admin e iap.tunnelResourceAccessor
#   - secreto cloudbuild-ssh-despliegue con la clave privada de `cbdeploy`,
#     cuya pública está en la metadata del proyecto.
steps:
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: desplegar
    entrypoint: bash
    secretEnv: ['SSH_KEY']
    args:
      - -c
      - |
        set -e
        # Clave estable: sin ella gcloud genera una nueva en cada build y espera
        # su propagación, que eran 4 de los 5 minutos de un despliegue.
        mkdir -p /root/.ssh
        printf '%s' "$$SSH_KEY" > /root/.ssh/cbdeploy
        chmod 600 /root/.ssh/cbdeploy
        ssh-keygen -y -f /root/.ssh/cbdeploy > /root/.ssh/cbdeploy.pub
        echo "Desplegando $_APP en $_VM (commit $COMMIT_SHA)"
        gcloud compute ssh "cbdeploy@$_VM" \
          --zone "$_ZONA" --project "$PROJECT_ID" \
          --tunnel-through-iap --quiet --ssh-key-file=/root/.ssh/cbdeploy \
          --command "sudo /opt/deploy/deploy.sh $_APP $_RAMA"

availableSecrets:
  secretManager:
    - versionName: projects/arrobamedellin/secrets/cloudbuild-ssh-despliegue/versions/1
      env: 'SSH_KEY'

substitutions:
  _VM: us2404-inscripciones-arrobamedellin-edu-co-v3
  _ZONA: us-central1-a
  _APP: cuee-sapiencia
  _RAMA: main

options:
  logging: CLOUD_LOGGING_ONLY

# El build de Next tarda ~1 min; 30 min deja margen para npm ci y reintentos.
timeout: 1800s
